<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ระบบผังภารกิจกลุ่มงาน</title>
<script>
  /* ===== แก้บรรทัดเดียว: วางลิงก์เว็บแอป (ลงท้ายด้วย /exec) ระหว่างเครื่องหมาย ' ' ===== */
  var URL_APP = 'วางลิงก์เว็บแอปตรงนี้';

  if (/^https:\/\/script\.google\.com\/.+\/exec$/.test(URL_APP)) {
    location.replace(URL_APP + location.search + location.hash);
  } else {
    document.addEventListener('DOMContentLoaded', function () {
      document.getElementById('msg').textContent = 'ยังไม่ได้ใส่ลิงก์เว็บแอปในไฟล์ index.html (ต้องขึ้นต้นด้วย https://script.google.com และลงท้ายด้วย /exec)';
    });
  }
</script>
<style>
  body { font-family: "Sarabun", Tahoma, sans-serif; margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f6fa; color: #1b2340; }
  .box { text-align: center; padding: 24px; }
  .spin { width: 28px; height: 28px; border: 3px solid #dde2ee; border-top-color: #3a60dd; border-radius: 50%; margin: 0 auto 12px; animation: s 0.8s linear infinite; }
  @keyframes s { to { transform: rotate(360deg); } }
  a { color: #3a60dd; }
</style>
</head>
<body>
  <div class="box">
    <div class="spin"></div>
    <div id="msg">กำลังเปิดระบบ…</div>
  </div>
</body>
</html>
